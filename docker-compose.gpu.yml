# GPU override file
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Prerequisites:
#   1. NVIDIA GPU driver installed on host
#   2. NVIDIA Container Toolkit installed
#   3. Verify with: docker info | grep nvidia
#
# Overrides the default compose to build the api with Dockerfile.gpu (CUDA base)
# and attach a GPU device.
services:
  api:
    build:
      context: ./apps/render
      dockerfile: Dockerfile.gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
