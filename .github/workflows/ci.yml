name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile Python sources
        run: uv run python -m compileall app cli.py main.py test

      - name: Run deterministic unit tests
        run: uv run python -X utf8 -m unittest test.services.test_state test.services.test_task test.services.test_schema test.services.test_batch test.services.test_subtitle_background_settings

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck + build the JS workspace. Desktop (@mpt/desktop) is excluded —
      # it needs the Rust/Tauri toolchain and is built in desktop-build.yml.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @mpt/web exec playwright install --with-deps chromium

      # The Playwright config's webServer builds + serves the production bundle.
      - name: Run e2e smoke tests
        run: pnpm --filter @mpt/web test:e2e

  cloud:
    name: Cloud backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cloud dependencies
        run: pip install -r apps/cloud/requirements.txt

      - name: Run cloud tests
        working-directory: apps/cloud
        env:
          AUTH_DEV_MODE: "1"
          DATABASE_URL: "sqlite:///./ci-test.db"
        run: python -m unittest discover -s tests -p "test_*.py" -v
